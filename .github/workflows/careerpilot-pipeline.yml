# CareerPilot scheduled pipeline: discovery, AI fit scoring, Gmail sync, application prep,
# email applications/outreach within policy, and the daily digest.
#
# Every 10 minutes (the candidate's choice, 2026-10-19): the repository is public, so GitHub-hosted
# Linux minutes are free.
# GitHub may start scheduled runs late (often 5-30 min) or skip them under load; every stage is
# idempotent and incremental, so a late or skipped run just catches up on the next one.
name: careerpilot-pipeline

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes; a run still going makes the next one wait (concurrency)
  workflow_dispatch:
    inputs:
      stages:
        description: 'Stages to run (all, or comma list: discover,ai,gmail,prepare,outreach,digest)'
        default: all

permissions:
  contents: read
  actions: write # to start careerpilot-apply when applications are queued

concurrency:
  group: careerpilot-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # GitHub started no scheduled run from 04:52 UTC on 2026-10-19, so each run also starts
      # careerpilot-tick, which starts the next run 30 minutes later unless a newer run comes first.
      - name: Start the 30-minute fallback clock
        continue-on-error: true # a disabled careerpilot-tick (its off switch) must not stop this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run careerpilot-tick.yml --repo "$GITHUB_REPOSITORY"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            careerpilot/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package.json', 'careerpilot/package-lock.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm ci --prefix careerpilot --ignore-scripts --no-audit --no-fund
      - name: Run pipeline
        working-directory: careerpilot
        env:
          RUN_BUDGET_MINUTES: '7'
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STAGES: ${{ inputs.stages || 'all' }}
        run: |
          if [ -z "$TURSO_DATABASE_URL" ]; then
            echo "::notice::TURSO_DATABASE_URL secret is not set yet; skipping (see careerpilot/SETUP.md)."
            exit 0
          fi
          node scripts/run.mjs "$STAGES"
      # GitHub delays scheduled runs under load and drops some (two on 2026-10-19), so the pipeline starts
      # the apply workflow itself as soon as applications are queued, rather than leaving it to its own cron.
      - name: Start applying if anything is queued
        working-directory: careerpilot
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TURSO_DATABASE_URL" ]; then exit 0; fi
          pending=$(node scripts/auto-apply.mjs --pending | tail -n 1)
          echo "Applications queued: $pending"
          if [ "${pending:-0}" != "0" ]; then gh workflow run careerpilot-apply.yml; fi
