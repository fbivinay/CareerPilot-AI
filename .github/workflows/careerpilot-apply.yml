# CareerPilot portal applications: fills and submits prepared applications on employer Workday sites
# (careerpilot/lib/apply). Questions the candidate's profile cannot answer stop that application, which is
# then blocked and emailed to the candidate; nothing is guessed and no CAPTCHA is solved.
#
# Every 10 minutes, 5 minutes after the pipeline that prepares applications (the candidate's choice,
# 2026-10-19; the repository is public, so GitHub-hosted Linux minutes are free). A run first counts what
# is queued without a browser and stops there when nothing is: an empty run takes about a minute.
name: careerpilot-apply

on:
  schedule:
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Most applications to attempt this run'
        default: '5'
      submit:
        description: 'Submit (false = fill up to Review only)'
        type: boolean
        default: true
      retry:
        description: 'Also retry blocked applications'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: careerpilot-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
      RETRY: ${{ inputs.retry && '--retry' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            careerpilot/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package.json', 'careerpilot/package-lock.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm ci --prefix careerpilot --ignore-scripts --no-audit --no-fund
      - name: Anything to apply?
        id: queue
        working-directory: careerpilot
        run: |
          if [ -z "$TURSO_DATABASE_URL" ]; then
            echo "::notice::TURSO_DATABASE_URL secret is not set yet; skipping (see careerpilot/SETUP.md)."
            echo "pending=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pending=$(node scripts/auto-apply.mjs --pending $RETRY | tail -n 1)
          echo "Applications queued: $pending"
          echo "pending=${pending:-0}" >> "$GITHUB_OUTPUT"
      - name: Restore browser
        if: steps.queue.outputs.pending != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: Install Chromium
        if: steps.queue.outputs.pending != '0'
        run: npx playwright install --with-deps chromium
      - name: Apply
        if: steps.queue.outputs.pending != '0'
        working-directory: careerpilot
        env:
          RUN_BUDGET_MINUTES: '24'
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} # drafts answers to open questions on forms
          LIMIT: ${{ inputs.limit || '5' }}
          # Scheduled runs submit; a manual run submits unless told not to.
          SUBMIT: ${{ (github.event_name == 'schedule' || inputs.submit) && '--submit' || '' }}
        run: node scripts/auto-apply.mjs $SUBMIT $RETRY --limit "$LIMIT"
